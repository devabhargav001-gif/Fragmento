<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FRAGMENTO - AI Thought Organizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

 

    <link rel="stylesheet" href="finale_style.css">
    <link rel="icon" href="fragmento.png">

</head>
   
<body>

 <section id="hero">

    <img src="fragmento.png" alt="Fragmento Logo" class="hero-logo">

    <h1>FRAGMENTO</h1>

    <p>
        Organize your scattered thoughts<br>
        into meaningful ideas.
    </p>

    <button id="startbtn">
        ✨ Start Writing
    </button>

    <div class="hero-footer">
        Fast • Private • AI Powered [v2]
    </div>
    </section>

    <main id="workspace">
        <nav class="topbar">

    <div class="brand">
        ✦ Fragmento
    </div>

    <div class="topbar-actions">

        <button id="homeBtn">🏠 Home</button>

        <button id="trashBtn" class = "coming-soon" >🗑 Trash</button>

        <button id="themeBtn">🌙 Theme</button>

    </div>

</nav>

        <div class="container">

<header class="app-header">
    <div class="logo-box">
        <img src="fragmento.png" alt="Fragmento Logo">
        <h1>FRAGMENTO</h1>
 
        <p>AI Powered Thought Organizer</p> 
    </div>
</header>

            <section>

                <textarea id="fragments"
                placeholder="Write anything that's on your mind..."></textarea>

                <div>
                    <span id="counter">Characters : 0/5000</span>
                </div>

                <div class="buttons">
                    <button id ="aiBtn" class = "coming-soon">🤖 AI Organize</button> 
                    <button id="organizebtn">Organize</button>
                    <button id="clearbtn">Clear</button>
                </div>

                <section id="result"></section>

            </section>

        </div>

    </main>
    <footer class="footer">
    <p>© 2026 · Designed & Developed by Devendra Bhargav</p>
</footer>

    <script src="script_three.js"></script>

</body>

</html>
